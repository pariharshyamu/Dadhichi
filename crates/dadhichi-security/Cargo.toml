[package]
name = "dadhichi-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Security suite: credential vault, secret detection, audit log, prompt-injection defense"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chacha20poly1305 = "0.10"
sha2 = "0.10"

# OS-level sandbox backend. Linux-only: the crate builds a Landlock ruleset.
# On other targets the sandbox reports `Unsupported` and no backend is pulled.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile = "3"
